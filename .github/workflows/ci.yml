name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type Check (legacy + V2 strict)
      run: npm run typecheck

    - name: Content Integrity Tests
      run: npm test

    - name: Content Validation (V2)
      run: npm run content:validate

    - name: Content Report (V2)
      run: npm run content:report

    - name: Build
      run: npm run build
